<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f4f1ea">
  <title>Sudoku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Sudoku</h1>
      <div class="row">
        <select id="difficulty" aria-label="Difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
          <option value="expert">Expert</option>
        </select>
        <button id="new">New game</button>
      </div>
    </header>

    <p id="status" class="status" aria-live="polite"></p>

    <div id="board" class="board" aria-label="Sudoku board"></div>

    <div class="tools">
      <button id="undo">Undo</button>
      <button id="notes" class="toggle" aria-pressed="false">Notes</button>
      <button data-d="0">Erase</button>
      <button id="hint">Hint</button>
    </div>

    <div class="pad">
      <button data-d="1">1</button>
      <button data-d="2">2</button>
      <button data-d="3">3</button>
      <button data-d="4">4</button>
      <button data-d="5">5</button>
      <button data-d="6">6</button>
      <button data-d="7">7</button>
      <button data-d="8">8</button>
      <button data-d="9">9</button>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
